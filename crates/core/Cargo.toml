[package]
name = "mn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mn_core"
path = "src/lib.rs"

# core has no OS deps by contract (docs/ARCHITECTURE.md) — image/zip/xml are
# explicitly fine, they are pure data.
[dependencies]
image = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ORA is a zip. `deflate-flate2` pulls the pure-Rust miniz_oxide backend that
# `image`'s PNG codec already brings in; everything else (aes, bzip2, lzma,
# zstd, time) is off.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.41"
# Grapheme-cluster stepping for the text caret (plans/05 item 5). Pure
# Rust, no platform deps — the DirectWrite GetClusterMetrics alternative
# would drag OS calls across this crate's platform-free contract for
# every keypress. Already in the tree transitively (same locked version).
unicode-segmentation = "1.13"
