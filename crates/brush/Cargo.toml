[package]
name = "mn-brush"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"
# Declares that this crate owns the native `mypaint` library, so cargo refuses
# a second crate linking it (duplicate C symbols would only show at link time).
links = "mypaint"

[lib]
name = "mn_brush"
path = "src/lib.rs"

[dependencies]
mn-core = { workspace = true }
# .myb presets are JSON. We parse them here instead of linking json-c into the
# vendored C — see vendor/PATCHES.md.
serde_json = "1"
# Texture-tip masks are grayscale PNGs next to the presets (round 26);
# png-only, the same trimmed feature set core uses.
image = { workspace = true }

[build-dependencies]
cc = "1"
# build.rs re-implements libmypaint's generate.py (brushsettings.json -> C
# enums + info arrays + the matching Rust id tables).
serde_json = "1"
